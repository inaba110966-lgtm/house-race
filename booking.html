<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>ご予約 | MACHUA DESIGNERS SALON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root{--black:#0a0a0a;--dark:#1a1a1a;--mid:#555;--light:#aaa;--pale:#e8e8e8;--white:#f5f5f5;--accent:#c8a97e;--ok:#3d8f5f;--ng:#aaa;--cl:#c0392b;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Noto Serif JP',serif;background:var(--white);color:var(--dark);min-height:100vh;}
    a{text-decoration:none;}

    /* ── Header ── */
    .hd{background:var(--black);padding:1rem 2.5rem;display:flex;justify-content:space-between;align-items:center;}
    .hd-logo{color:var(--white);font-family:'Cormorant Garamond',serif;font-size:1.1rem;letter-spacing:0.3em;}
    .hd-right{display:flex;align-items:center;gap:1.5rem;}
    .hd-title{color:rgba(255,255,255,0.4);font-family:'Cormorant Garamond',serif;font-size:0.7rem;letter-spacing:0.35em;text-transform:uppercase;}
    .hd-admin{color:rgba(255,255,255,0.3);font-size:0.68rem;letter-spacing:0.1em;border:1px solid rgba(255,255,255,0.15);padding:0.25rem 0.7rem;transition:all 0.2s;}
    .hd-admin:hover{color:var(--white);border-color:rgba(255,255,255,0.5);}

    /* ── Controls ── */
    .ctrl{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 2.5rem;border-bottom:1px solid var(--pale);gap:1rem;flex-wrap:wrap;}
    .ctrl-nav{display:flex;align-items:center;gap:0.8rem;}
    .btn-arr{background:none;border:1px solid var(--pale);color:var(--dark);padding:0.32rem 1rem;cursor:pointer;font-size:0.8rem;transition:border-color 0.2s;}
    .btn-arr:hover{border-color:var(--mid);}
    .ctrl-lbl{font-family:'Cormorant Garamond',serif;font-size:1rem;min-width:210px;text-align:center;letter-spacing:0.05em;}
    .ctrl-right{display:flex;align-items:center;gap:0.8rem;}
    .btn-today{background:none;border:1px solid var(--accent);color:var(--accent);padding:0.32rem 0.9rem;cursor:pointer;font-size:0.74rem;letter-spacing:0.08em;}
    .vtoggle{display:flex;border:1px solid var(--pale);overflow:hidden;}
    .vbtn{background:none;border:none;padding:0.32rem 1.1rem;cursor:pointer;font-size:0.74rem;letter-spacing:0.1em;color:var(--mid);transition:all 0.2s;}
    .vbtn.on{background:var(--dark);color:var(--white);}

    /* ── Legend ── */
    .legend{display:flex;gap:1.8rem;padding:0.7rem 2.5rem;background:#ebebeb;font-size:0.7rem;color:var(--mid);flex-wrap:wrap;}
    .leg{display:flex;align-items:center;gap:0.4rem;}
    .ldot{width:9px;height:9px;border-radius:50%;}

    /* ── Daily view ── */
    .daily{max-width:560px;margin:0 auto;padding:1.8rem 2rem 4rem;}
    .day-header{text-align:center;margin-bottom:1.5rem;}
    .day-header h2{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:300;letter-spacing:0.1em;color:var(--black);}
    .slot{display:flex;align-items:center;gap:0.8rem;padding:0.4rem 0;border-bottom:1px solid var(--pale);min-height:56px;}
    .slot-t{width:58px;font-family:'Cormorant Garamond',serif;font-size:0.92rem;color:var(--mid);flex-shrink:0;font-weight:400;}
    .slot-s{flex:1;}
    .sbtn{display:block;width:100%;padding:0.55rem 1rem;text-align:center;cursor:pointer;border:none;font-size:0.78rem;font-family:'Noto Serif JP',serif;letter-spacing:0.08em;border-radius:3px;transition:opacity 0.15s,filter 0.15s;}
    .s-ok{background:rgba(61,143,95,0.12);color:#2a7048;border:1px solid rgba(61,143,95,0.25);}
    .s-ok:hover{background:rgba(61,143,95,0.2);}
    .s-ng{background:rgba(0,0,0,0.05);color:var(--light);border:1px solid transparent;cursor:default;}
    .s-cl{background:rgba(192,57,43,0.06);color:var(--cl);border:1px dashed rgba(192,57,43,0.25);cursor:default;font-size:0.74rem;}

    /* ── Weekly view ── */
    .wkwrap{overflow-x:auto;padding:0 0 3rem;}
    .wkgrid{display:grid;min-width:700px;}
    .wk-th{font-size:0.72rem;text-align:center;padding:0.7rem 0.3rem;border-bottom:2px solid var(--dark);background:var(--white);position:sticky;top:0;z-index:2;line-height:1.6;}
    .wk-th.tod{background:rgba(200,169,126,0.13);font-weight:bold;}
    .wk-time{font-family:'Cormorant Garamond',serif;font-size:0.8rem;color:var(--mid);padding:0 0.6rem;border-right:2px solid var(--pale);border-bottom:1px solid var(--pale);display:flex;align-items:center;min-height:48px;font-weight:400;}
    .wk-cell{border-right:1px solid var(--pale);border-bottom:1px solid var(--pale);min-height:48px;padding:4px;}
    .wk-cell.tod{background:rgba(200,169,126,0.04);}
    /* Slot blocks replace icon-only buttons */
    .wcbtn{width:100%;height:100%;min-height:40px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:500;letter-spacing:0.06em;border-radius:3px;transition:opacity 0.15s,filter 0.15s;}
    .w-ok{background:rgba(61,143,95,0.12);color:#2a7048;border:1px solid rgba(61,143,95,0.25);}
    .w-ok:hover{background:rgba(61,143,95,0.22);filter:brightness(0.97);}
    .w-ng{background:rgba(0,0,0,0.05);color:var(--light);border:1px solid transparent;cursor:default;}
    .w-cl{background:rgba(192,57,43,0.06);color:var(--cl);border:1px dashed rgba(192,57,43,0.25);cursor:default;font-size:0.68rem;}

    @media(max-width:640px){
      .ctrl{flex-direction:column;align-items:flex-start;}
      .ctrl-lbl{min-width:0;font-size:0.9rem;}
      .hd{padding:1rem 1.5rem;}
    }
  </style>
</head>
<body>

<header class="hd">
  <a href="index.html" class="hd-logo">MACHUA</a>
  <div class="hd-right">
    <span class="hd-title">Reservation</span>
    <a href="admin.html" class="hd-admin">管理画面</a>
  </div>
</header>

<div class="ctrl">
  <div class="ctrl-nav">
    <button class="btn-arr" id="prevBtn">&#8249; 前へ</button>
    <span class="ctrl-lbl" id="ctrlLbl"></span>
    <button class="btn-arr" id="nextBtn">次へ &#8250;</button>
  </div>
  <div class="ctrl-right">
    <button class="btn-today" id="todayBtn">今日</button>
    <div class="vtoggle">
      <button class="vbtn on" id="vDaily">日次</button>
      <button class="vbtn" id="vWeekly">週次</button>
    </div>
  </div>
</div>

<div class="legend">
  <div class="leg"><div class="ldot" style="background:var(--ok)"></div>予約可能</div>
  <div class="leg"><div class="ldot" style="background:var(--ng)"></div>受付不可</div>
  <div class="leg"><div class="ldot" style="background:var(--cl)"></div>定休日</div>
</div>

<div id="grid"></div>

<script src="booking-data.js"></script>
<script>
  let cur  = MACHUA.today();
  let view = 'daily';

  const $lbl  = document.getElementById('ctrlLbl');
  const $grid = document.getElementById('grid');
  const $vD   = document.getElementById('vDaily');
  const $vW   = document.getElementById('vWeekly');

  $vD.onclick = () => { view='daily';  $vD.classList.add('on'); $vW.classList.remove('on'); render(); };
  $vW.onclick = () => { view='weekly'; $vW.classList.add('on'); $vD.classList.remove('on'); render(); };

  document.getElementById('prevBtn').onclick = () => {
    const d=MACHUA.fromStr(cur); d.setDate(d.getDate()-(view==='weekly'?7:1)); cur=MACHUA.toStr(d); render();
  };
  document.getElementById('nextBtn').onclick = () => {
    const d=MACHUA.fromStr(cur); d.setDate(d.getDate()+(view==='weekly'?7:1)); cur=MACHUA.toStr(d); render();
  };
  document.getElementById('todayBtn').onclick = () => { cur=MACHUA.today(); render(); };

  function go(date, time){ location.href=`booking-form.html?date=${date}&time=${time}`; }

  function renderDaily(){
    const d=MACHUA.fromStr(cur);
    $lbl.textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${MACHUA.DAY[d.getDay()]}）`;
    const slots=MACHUA.getDateSlots(cur);
    let h=`<div class="daily"><div class="day-header"><h2>${d.getMonth()+1}月${d.getDate()}日（${MACHUA.DAY[d.getDay()]}）</h2></div>`;
    slots.forEach(s=>{
      h+=`<div class="slot"><div class="slot-t">${s.time}</div><div class="slot-s">`;
      if(s.closed)      h+=`<span class="sbtn s-cl">定休日</span>`;
      else if(s.available) h+=`<button class="sbtn s-ok" onclick="go('${cur}','${s.time}')">● 予約する</button>`;
      else               h+=`<span class="sbtn s-ng">× 受付不可</span>`;
      h+=`</div></div>`;
    });
    h+=`</div>`;
    return h;
  }

  function renderWeekly(){
    const days=MACHUA.weekOf(cur), slots=MACHUA.getAllSlots(), tod=MACHUA.today();
    const fd=MACHUA.fromStr(days[0]),ld=MACHUA.fromStr(days[6]);
    $lbl.textContent=`${fd.getMonth()+1}/${fd.getDate()} 〜 ${ld.getMonth()+1}/${ld.getDate()}`;
    const ds=days.map(d=>MACHUA.getDateSlots(d));
    let h=`<div class="wkwrap"><div class="wkgrid" style="grid-template-columns:58px repeat(7,1fr);">`;
    // Header row
    h+=`<div class="wk-th"></div>`;
    days.forEach((d,i)=>{
      const fd2=MACHUA.fromStr(d),isT=d===tod;
      const color=['#c0392b','#333','#333','#333','#333','#333','#1a5276'][i];
      h+=`<div class="wk-th${isT?' tod':''}"><span style="color:${color};font-size:0.72rem">${fd2.getMonth()+1}/${fd2.getDate()}</span><br>${MACHUA.DAY[i]}</div>`;
    });
    // Slot rows
    slots.forEach(time=>{
      h+=`<div class="wk-time">${time}</div>`;
      days.forEach((d,di)=>{
        const sl=ds[di].find(x=>x.time===time), isT=d===tod;
        const cls=sl.closed?'w-cl':sl.available?'w-ok':'w-ng';
        const label=sl.closed?'定休日':sl.available?'予約可':'受付不可';
        h+=`<div class="wk-cell${isT?' tod':''}">`;
        h+=sl.available&&!sl.closed
          ?`<button class="wcbtn ${cls}" onclick="go('${d}','${time}')">${label}</button>`
          :`<div class="wcbtn ${cls}">${label}</div>`;
        h+=`</div>`;
      });
    });
    h+=`</div></div>`;
    return h;
  }

  function render(){ $grid.innerHTML=view==='daily'?renderDaily():renderWeekly(); }
  render();
</script>
</body>
</html>
