<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>稼働マスタ | MACHUA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root{--black:#0a0a0a;--dark:#1a1a1a;--mid:#555;--light:#aaa;--pale:#e8e8e8;--white:#f5f5f5;--accent:#c8a97e;--cl:#c0392b;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Noto Serif JP',serif;background:#f0f0f0;color:var(--dark);}
    a{text-decoration:none;color:inherit;}
    .admin-wrap{display:flex;min-height:100vh;}
    .sidebar{width:200px;background:var(--black);flex-shrink:0;display:flex;flex-direction:column;}
    .sb-logo{padding:1.4rem 1.5rem;font-family:'Cormorant Garamond',serif;font-size:0.9rem;letter-spacing:0.3em;color:var(--white);border-bottom:1px solid rgba(255,255,255,0.07);}
    .sb-logo small{display:block;font-size:0.55rem;letter-spacing:0.2em;color:rgba(255,255,255,0.3);margin-top:0.2rem;text-transform:uppercase;}
    .sb-nav{flex:1;padding:0.8rem 0;}
    .sb-link{display:flex;align-items:center;gap:0.7rem;padding:0.7rem 1.5rem;font-size:0.76rem;letter-spacing:0.08em;color:rgba(255,255,255,0.5);transition:all 0.2s;}
    .sb-link:hover{color:var(--white);background:rgba(255,255,255,0.05);}
    .sb-link.active{color:var(--white);background:rgba(255,255,255,0.08);border-left:2px solid var(--accent);}
    .sb-link .icon{font-size:0.9rem;}
    .sb-bottom{padding:1rem 1.5rem;border-top:1px solid rgba(255,255,255,0.07);}
    .sb-logout{background:none;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.4);font-size:0.7rem;letter-spacing:0.1em;padding:0.4rem 0.8rem;cursor:pointer;width:100%;transition:all 0.2s;}
    .sb-logout:hover{color:var(--white);border-color:rgba(255,255,255,0.4);}
    .main{flex:1;overflow:auto;}
    .main-header{background:var(--white);border-bottom:1px solid var(--pale);padding:1rem 2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
    .main-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:300;letter-spacing:0.12em;flex:1;}
    .main-body{padding:1.5rem 2rem 4rem;}
    .two-col{display:grid;grid-template-columns:1fr 320px;gap:1.5rem;align-items:start;}

    /* Calendar */
    .cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
    .cal-nav h3{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:300;letter-spacing:0.1em;}
    .btn-arr{background:var(--white);border:1px solid var(--pale);color:var(--dark);padding:0.3rem 0.8rem;cursor:pointer;font-size:0.78rem;}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--pale);}
    .cal-th{background:var(--dark);color:rgba(255,255,255,0.5);text-align:center;padding:0.4rem;font-family:'Cormorant Garamond',serif;font-size:0.7rem;letter-spacing:0.15em;}
    .cal-th:first-child{color:#e88;}
    .cal-th:last-child{color:#88e;}
    .cal-day{background:var(--white);min-height:64px;padding:0.3rem;cursor:pointer;transition:background 0.15s;position:relative;}
    .cal-day:hover{background:#ececec;}
    .cal-day.empty{background:#f8f8f8;cursor:default;}
    .cal-day.today .dn{font-weight:bold;color:var(--accent);}
    .cal-day.closed{background:rgba(192,57,43,0.06);}
    .cal-day.closed .dn{color:var(--cl);}
    .dn{font-size:0.82rem;margin-bottom:0.2rem;}
    .closed-badge{font-size:0.6rem;color:var(--cl);letter-spacing:0.05em;}
    .cap-badge{font-size:0.6rem;color:var(--mid);}
    .bk-count{font-size:0.6rem;color:var(--accent);}

    /* Side panel */
    .side-card{background:var(--white);border:1px solid var(--pale);padding:1.4rem;}
    .side-title{font-family:'Cormorant Garamond',serif;font-size:0.9rem;letter-spacing:0.15em;font-weight:300;margin-bottom:1.2rem;padding-bottom:0.6rem;border-bottom:1px solid var(--pale);}
    .form-group{margin-bottom:1rem;}
    .form-group label{display:block;font-family:'Cormorant Garamond',serif;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--light);margin-bottom:0.4rem;}
    .form-group input{width:100%;padding:0.55rem 0.7rem;border:1px solid var(--pale);background:var(--white);font-size:0.85rem;outline:none;}
    .form-group input:focus{border-color:var(--accent);}
    .btn-primary{padding:0.55rem 1.2rem;background:var(--dark);color:var(--white);border:none;cursor:pointer;font-size:0.76rem;letter-spacing:0.1em;width:100%;transition:background 0.2s;}
    .btn-primary:hover{background:#333;}
    .btn-danger{padding:0.45rem 1rem;background:none;border:1px solid var(--cl);color:var(--cl);cursor:pointer;font-size:0.72rem;width:100%;transition:all 0.2s;margin-top:0.5rem;}
    .btn-danger:hover{background:var(--cl);color:var(--white);}
    .selected-info{margin-bottom:1.2rem;padding:0.8rem;background:#f8f8f8;font-size:0.8rem;}
    .selected-date{font-family:'Cormorant Garamond',serif;font-size:1rem;margin-bottom:0.2rem;}
    .no-sel{font-size:0.78rem;color:var(--light);text-align:center;padding:2rem 0;}

    /* Default capacity */
    .default-card{background:var(--white);border:1px solid var(--pale);padding:1.2rem;margin-bottom:1.5rem;}
    .default-row{display:flex;align-items:center;gap:1rem;}
    .default-label{font-size:0.8rem;flex:1;}
    .default-input{width:70px;padding:0.4rem 0.6rem;border:1px solid var(--pale);font-size:0.85rem;outline:none;text-align:center;}
    .default-input:focus{border-color:var(--accent);}
    .btn-save-sm{padding:0.4rem 0.9rem;background:var(--dark);color:var(--white);border:none;cursor:pointer;font-size:0.72rem;}

    /* Admin email */
    .email-row{display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;}
    .email-input{flex:1;min-width:180px;padding:0.4rem 0.7rem;border:1px solid var(--pale);font-size:0.8rem;outline:none;}
    .email-input:focus{border-color:var(--accent);}

    /* Password gate */
    .pw-bg{position:fixed;inset:0;background:rgba(10,10,10,0.92);z-index:400;display:flex;align-items:center;justify-content:center;}
    .pw-box{background:var(--white);max-width:380px;width:100%;padding:2.5rem;}
    .pw-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:300;letter-spacing:0.1em;text-align:center;margin-bottom:0.4rem;}
    .pw-sub{font-size:0.74rem;color:var(--light);text-align:center;margin-bottom:1.8rem;}
    .pw-input{width:100%;padding:0.75rem 1rem;border:1px solid var(--pale);font-size:0.9rem;outline:none;margin-bottom:0.8rem;}
    .pw-input:focus{border-color:var(--accent);}
    .pw-btn{width:100%;padding:0.8rem;background:var(--black);color:var(--white);border:none;font-size:0.8rem;letter-spacing:0.2em;cursor:pointer;}
    .pw-err{color:#c0392b;font-size:0.74rem;text-align:center;margin-bottom:0.6rem;display:none;}
    .hidden{display:none!important;}

    @media(max-width:900px){ .two-col{grid-template-columns:1fr;} }
    @media(max-width:700px){
      .sidebar{width:56px;}
      .sb-logo,.sb-link span,.sb-bottom,.sb-logo small{display:none;}
      .sb-link{justify-content:center;padding:0.8rem;}
    }
  </style>
</head>
<body>

<!-- Password gate -->
<div class="pw-bg" id="pwGate">
  <div class="pw-box">
    <div class="pw-title">MACHUA 管理画面</div>
    <div class="pw-sub">パスワードを入力してください</div>
    <p class="pw-err" id="pwErr">パスワードが違います</p>
    <input type="password" class="pw-input" id="pwInput" placeholder="Password" autocomplete="current-password"/>
    <button class="pw-btn" id="pwBtn">ログイン</button>
  </div>
</div>

<div class="admin-wrap hidden" id="adminApp">
  <aside class="sidebar">
    <div class="sb-logo">MACHUA<small>Admin</small></div>
    <nav class="sb-nav">
      <a href="admin.html"          class="sb-link"><span class="icon">📅</span><span>予約カレンダー</span></a>
      <a href="admin-courses.html"  class="sb-link"><span class="icon">✂️</span><span>コースマスタ</span></a>
      <a href="admin-schedule.html" class="sb-link active"><span class="icon">⚙️</span><span>稼働マスタ</span></a>
    </nav>
    <div class="sb-bottom">
      <button class="sb-logout" onclick="MACHUA.auth.logout()">ログアウト</button>
    </div>
  </aside>

  <div class="main">
    <div class="main-header">
      <span class="main-title">稼働・営業日マスタ</span>
    </div>
    <div class="main-body">

      <!-- Default capacity & admin email -->
      <div class="default-card">
        <div style="display:flex;gap:2rem;flex-wrap:wrap;">
          <div style="flex:1;min-width:200px;">
            <div style="font-family:'Cormorant Garamond',serif;font-size:0.65rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--light);margin-bottom:0.5rem;">デフォルトキャパシティ（同時受付人数）</div>
            <div class="default-row">
              <input type="number" class="default-input" id="defCap" min="1" max="10"/>
              <span class="default-label" style="font-size:0.74rem;color:var(--mid);">人 / 時間枠</span>
              <button class="btn-save-sm" onclick="saveDefCap()">保存</button>
            </div>
          </div>
          <div style="flex:2;min-width:260px;">
            <div style="font-family:'Cormorant Garamond',serif;font-size:0.65rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--light);margin-bottom:0.5rem;">管理者通知メールアドレス</div>
            <div class="email-row">
              <input type="email" class="email-input" id="adminEmail" placeholder="admin@example.com"/>
              <button class="btn-save-sm" onclick="saveAdminEmail()">保存</button>
            </div>
          </div>
        </div>
      </div>

      <div class="two-col">
        <!-- Calendar -->
        <div>
          <div class="cal-nav">
            <button class="btn-arr" id="prevMonth">&#8249;</button>
            <h3 id="calTitle"></h3>
            <button class="btn-arr" id="nextMonth">&#8250;</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div style="display:flex;gap:1.5rem;margin-top:0.8rem;font-size:0.7rem;color:var(--mid);">
            <span><span style="color:var(--cl)">●</span> 定休日</span>
            <span><span style="color:var(--accent)">●</span> 予約あり</span>
            <span style="color:var(--light)">数字 = キャパシティ</span>
          </div>
        </div>

        <!-- Side panel -->
        <div class="side-card" id="sidePanel">
          <div class="side-title">日別設定</div>
          <div class="no-sel" id="noSel">カレンダーから日付を選択してください</div>
          <div class="hidden" id="dayEdit">
            <div class="selected-info">
              <div class="selected-date" id="selDateStr"></div>
              <div id="selBkCount" style="font-size:0.72rem;color:var(--accent);margin-top:0.2rem;"></div>
            </div>
            <div class="form-group">
              <label>キャパシティ（人数）<br><span style="font-weight:normal;font-size:0.6rem;letter-spacing:0.05em">空白=デフォルト値を使用</span></label>
              <input type="number" id="dayCap" min="1" max="10" placeholder="デフォルト値"/>
            </div>
            <button class="btn-primary" onclick="saveDay()">この日の設定を保存</button>
            <button class="btn-danger" id="toggleClosedBtn" onclick="toggleClosed()">定休日に設定する</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="booking-data.js"></script>
<script>
  /* ── Auth ─────────────────────────────────────────── */
  function checkAuth(){
    if(MACHUA.auth.check()){ document.getElementById('pwGate').classList.add('hidden'); document.getElementById('adminApp').classList.remove('hidden'); init(); }
  }
  document.getElementById('pwBtn').onclick=()=>{
    if(MACHUA.auth.login(document.getElementById('pwInput').value)) checkAuth();
    else document.getElementById('pwErr').style.display='block';
  };
  document.getElementById('pwInput').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('pwBtn').click(); });
  checkAuth();

  /* ── State ────────────────────────────────────────── */
  let calYear, calMonth, selDate=null;

  function init(){
    const now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth();
    // Load defaults
    const s=MACHUA.schedule.get();
    document.getElementById('defCap').value=s.defaultCapacity||1;
    document.getElementById('adminEmail').value=s.adminEmail||'';
    renderCal();
  }

  /* ── Default capacity & email ───────────────────── */
  function saveDefCap(){
    const v=Number(document.getElementById('defCap').value)||1;
    const s=MACHUA.schedule.get(); s.defaultCapacity=v; MACHUA.schedule.set(s);
    renderCal(); alert('保存しました');
  }
  function saveAdminEmail(){
    const v=document.getElementById('adminEmail').value.trim();
    const s=MACHUA.schedule.get(); s.adminEmail=v; MACHUA.schedule.set(s);
    alert('保存しました');
  }

  /* ── Calendar ─────────────────────────────────────── */
  document.getElementById('prevMonth').onclick=()=>{ if(calMonth===0){calMonth=11;calYear--;}else calMonth--; renderCal(); };
  document.getElementById('nextMonth').onclick=()=>{ if(calMonth===11){calMonth=0;calYear++;}else calMonth++; renderCal(); };

  function renderCal(){
    const tod=MACHUA.today();
    document.getElementById('calTitle').textContent=`${calYear}年${calMonth+1}月`;
    const first=new Date(calYear,calMonth,1).getDay();
    const days=new Date(calYear,calMonth+1,0).getDate();
    const sched=MACHUA.schedule.get();

    let h='';
    ['日','月','火','水','木','金','土'].forEach(d=>{ h+=`<div class="cal-th">${d}</div>`; });
    for(let i=0;i<first;i++) h+=`<div class="cal-day empty"></div>`;

    for(let d=1;d<=days;d++){
      const dt=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isClosed=sched.closedDays.includes(dt);
      const cap=sched.capacity[dt]??sched.defaultCapacity;
      const bks=MACHUA.bookings.forDate(dt);
      const isToday=dt===tod;
      const isSel=dt===selDate;
      h+=`<div class="cal-day${isClosed?' closed':''}${isToday?' today':''}${isSel?' selected':''}" style="${isSel?'outline:2px solid var(--accent);outline-offset:-2px;':''}" onclick="selectDay('${dt}')">
        <div class="dn">${d}</div>
        ${isClosed?`<div class="closed-badge">定休日</div>`:`<div class="cap-badge">×${cap}</div>`}
        ${bks.length?`<div class="bk-count">${bks.length}件</div>`:''}
      </div>`;
    }
    document.getElementById('calGrid').innerHTML=h;
  }

  /* ── Day selection ───────────────────────────────── */
  function selectDay(dt){
    selDate=dt;
    renderCal();
    const sched=MACHUA.schedule.get();
    const isClosed=sched.closedDays.includes(dt);
    const cap=sched.capacity[dt];
    const bks=MACHUA.bookings.forDate(dt);
    const d=MACHUA.fromStr(dt);

    document.getElementById('noSel').classList.add('hidden');
    document.getElementById('dayEdit').classList.remove('hidden');
    document.getElementById('selDateStr').textContent=MACHUA.fmt(dt);
    document.getElementById('selBkCount').textContent=bks.length?`予約: ${bks.length}件`:'予約なし';
    document.getElementById('dayCap').value=cap??'';

    const btn=document.getElementById('toggleClosedBtn');
    btn.textContent=isClosed?'定休日を解除する':'定休日に設定する';
    btn.style.borderColor=isClosed?'var(--mid)':'#c0392b';
    btn.style.color=isClosed?'var(--mid)':'#c0392b';
  }

  function saveDay(){
    if(!selDate) return;
    const capVal=document.getElementById('dayCap').value;
    if(capVal==='') {
      const s=MACHUA.schedule.get(); delete s.capacity[selDate]; MACHUA.schedule.set(s);
    } else {
      MACHUA.schedule.setCap(selDate,Number(capVal));
    }
    renderCal(); selectDay(selDate); alert('保存しました');
  }

  function toggleClosed(){
    if(!selDate) return;
    MACHUA.schedule.toggleClosed(selDate);
    renderCal(); selectDay(selDate);
  }
</script>
</body>
</html>
