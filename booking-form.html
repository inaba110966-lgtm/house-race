<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>予約フォーム | MACHUA DESIGNERS SALON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root{--black:#0a0a0a;--dark:#1a1a1a;--mid:#555;--light:#aaa;--pale:#e8e8e8;--white:#f5f5f5;--accent:#c8a97e;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Noto Serif JP',serif;background:var(--white);color:var(--dark);}
    a{text-decoration:none;}

    /* Header */
    .hd{background:var(--black);padding:1rem 2.5rem;display:flex;justify-content:space-between;align-items:center;}
    .hd-logo{color:var(--white);font-family:'Cormorant Garamond',serif;font-size:1.1rem;letter-spacing:0.3em;}
    .hd-back{color:rgba(255,255,255,0.45);font-size:0.72rem;letter-spacing:0.1em;display:flex;align-items:center;gap:0.4rem;transition:color 0.2s;}
    .hd-back:hover{color:var(--white);}

    .container{max-width:680px;margin:0 auto;padding:2.5rem 2rem 5rem;}

    /* Section titles */
    .sec-label{font-family:'Cormorant Garamond',serif;font-size:0.65rem;letter-spacing:0.4em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:0.6rem;}
    .sec-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:300;letter-spacing:0.1em;color:var(--black);margin-bottom:1.5rem;}

    /* Datetime badge */
    .dt-badge{background:var(--black);color:var(--white);padding:1.2rem 1.8rem;margin-bottom:2.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;}
    .dt-badge .date-str{font-family:'Cormorant Garamond',serif;font-size:1.1rem;letter-spacing:0.08em;}
    .dt-badge .time-str{font-family:'Cormorant Garamond',serif;font-size:1.5rem;letter-spacing:0.1em;color:var(--accent);}

    /* Course select */
    .course-list{display:flex;flex-direction:column;gap:0;margin-bottom:2rem;border:1px solid var(--pale);}
    .course-item{display:flex;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--pale);cursor:pointer;transition:background 0.15s;}
    .course-item:last-child{border-bottom:none;}
    .course-item:hover{background:rgba(0,0,0,0.03);}
    .course-item.selected{background:rgba(200,169,126,0.08);border-left:3px solid var(--accent);}
    .course-item input[type=radio]{margin-right:1rem;accent-color:var(--accent);width:16px;height:16px;flex-shrink:0;}
    .course-name{font-size:0.88rem;flex:1;}
    .course-meta{text-align:right;font-family:'Cormorant Garamond',serif;}
    .course-price{font-size:1rem;letter-spacing:0.05em;}
    .course-time{font-size:0.72rem;color:var(--light);display:block;}

    /* Options */
    .opt-section{margin-bottom:2rem;}
    .opt-note{font-size:0.74rem;color:var(--light);margin-bottom:0.8rem;letter-spacing:0.05em;}
    .opt-list{display:flex;flex-direction:column;gap:0;border:1px solid var(--pale);}
    .opt-item{display:flex;align-items:center;padding:0.8rem 1.2rem;border-bottom:1px solid var(--pale);cursor:pointer;transition:background 0.15s;}
    .opt-item:last-child{border-bottom:none;}
    .opt-item:hover{background:rgba(0,0,0,0.03);}
    .opt-item.selected{background:rgba(200,169,126,0.08);}
    .opt-item input[type=checkbox]{margin-right:1rem;accent-color:var(--accent);width:15px;height:15px;flex-shrink:0;}
    .opt-name{flex:1;font-size:0.84rem;}
    .opt-meta{text-align:right;font-family:'Cormorant Garamond',serif;font-size:0.88rem;}
    .opt-t{font-size:0.7rem;color:var(--light);display:block;}
    #optEmpty{font-size:0.78rem;color:var(--light);padding:0.8rem 1.2rem;border:1px solid var(--pale);}

    /* Total */
    .total-box{background:var(--dark);color:var(--white);padding:1.4rem 1.8rem;margin-bottom:2.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.8rem;}
    .total-label{font-family:'Cormorant Garamond',serif;font-size:0.7rem;letter-spacing:0.35em;text-transform:uppercase;color:rgba(255,255,255,0.4);}
    .total-price{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;letter-spacing:0.05em;}
    .total-time{font-family:'Cormorant Garamond',serif;font-size:1rem;color:rgba(255,255,255,0.5);margin-top:0.2rem;}

    /* Form */
    .form-group{margin-bottom:1.4rem;}
    .form-group label{display:block;font-size:0.72rem;letter-spacing:0.15em;color:var(--mid);margin-bottom:0.5rem;text-transform:uppercase;font-family:'Cormorant Garamond',serif;}
    .form-group label span{color:#c0392b;margin-left:2px;}
    .form-group input{width:100%;padding:0.75rem 1rem;border:1px solid var(--pale);background:var(--white);font-family:'Noto Serif JP',serif;font-size:0.88rem;color:var(--dark);outline:none;transition:border-color 0.2s;}
    .form-group input:focus{border-color:var(--accent);}
    .form-group input.err{border-color:#c0392b;}

    /* Submit */
    .submit-btn{width:100%;padding:1.1rem;background:var(--black);color:var(--white);border:none;font-family:'Cormorant Garamond',serif;font-size:0.85rem;letter-spacing:0.25em;text-transform:uppercase;cursor:pointer;transition:background 0.2s;margin-top:0.5rem;}
    .submit-btn:hover{background:#333;}
    .submit-btn:disabled{background:var(--pale);color:var(--light);cursor:default;}

    /* Confirmation modal */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;}
    .modal{background:var(--white);max-width:480px;width:100%;padding:2.5rem;}
    .modal-icon{font-size:2.5rem;text-align:center;margin-bottom:1rem;}
    .modal-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;letter-spacing:0.1em;text-align:center;margin-bottom:0.4rem;}
    .modal-sub{font-size:0.78rem;color:var(--mid);text-align:center;margin-bottom:1.8rem;}
    .modal-details{background:#f0f0f0;padding:1.2rem 1.4rem;font-size:0.8rem;line-height:2;margin-bottom:1.8rem;}
    .modal-details dt{font-family:'Cormorant Garamond',serif;font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--light);}
    .modal-details dd{margin-bottom:0.4rem;}
    .modal-note{font-size:0.72rem;color:var(--light);text-align:center;margin-bottom:1.5rem;line-height:1.8;}
    .modal-btn{width:100%;padding:0.9rem;background:var(--black);color:var(--white);border:none;font-family:'Cormorant Garamond',serif;font-size:0.8rem;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;}
    .modal-btn2{width:100%;padding:0.7rem;background:none;color:var(--mid);border:1px solid var(--pale);font-size:0.78rem;cursor:pointer;margin-top:0.6rem;}
    .hidden{display:none;}

    @media(max-width:540px){
      .container{padding:1.5rem 1rem 4rem;}
      .dt-badge{flex-direction:column;}
    }
  </style>
</head>
<body>

<header class="hd">
  <a href="index.html" class="hd-logo">MACHUA</a>
  <a href="javascript:history.back()" class="hd-back">&#8592; 日程選択に戻る</a>
</header>

<div class="container">
  <div class="dt-badge">
    <span class="date-str" id="dateStr"></span>
    <span class="time-str" id="timeStr"></span>
  </div>

  <!-- Course -->
  <span class="sec-label">Step 1</span>
  <p class="sec-title">コースを選択</p>
  <div class="course-list" id="courseList"></div>

  <!-- Options -->
  <div class="opt-section" id="optSection">
    <span class="sec-label">Step 2</span>
    <p class="sec-title">オプションを選択</p>
    <p class="opt-note">※複数選択可</p>
    <div id="optList"></div>
  </div>

  <!-- Total -->
  <div class="total-box">
    <div>
      <div class="total-label">合計金額</div>
      <div class="total-price" id="totalPrice">¥0</div>
    </div>
    <div style="text-align:right">
      <div class="total-label">所要時間</div>
      <div class="total-time" id="totalTime">— 分</div>
    </div>
  </div>

  <!-- Personal info -->
  <span class="sec-label">Step 3</span>
  <p class="sec-title">お客様情報</p>
  <div class="form-group">
    <label>お名前<span>*</span></label>
    <input type="text" id="fName" placeholder="山田 太郎"/>
  </div>
  <div class="form-group">
    <label>電話番号<span>*</span></label>
    <input type="tel" id="fPhone" placeholder="090-0000-0000"/>
  </div>
  <div class="form-group">
    <label>メールアドレス<span>*</span></label>
    <input type="email" id="fEmail" placeholder="example@email.com"/>
  </div>

  <button class="submit-btn" id="submitBtn" disabled>予約を確定する</button>
</div>

<!-- Confirmation modal -->
<div class="modal-bg hidden" id="modal">
  <div class="modal">
    <div class="modal-icon">✓</div>
    <div class="modal-title">ご予約が完了しました</div>
    <div class="modal-sub">以下の内容でご予約を承りました</div>
    <dl class="modal-details" id="modalDetails"></dl>
    <p class="modal-note">確認メールの送信を試みます。<br>開かない場合はお電話でご確認ください。<br>Tel: 0466-53-1202</p>
    <button class="modal-btn" onclick="location.href='booking.html'">トップへ戻る</button>
    <button class="modal-btn2" id="retryMail">メールを再送する</button>
  </div>
</div>

<script src="booking-data.js"></script>
<script>
  const p  = new URLSearchParams(location.search);
  const bDate = p.get('date'), bTime = p.get('time');
  if(!bDate||!bTime){ location.href='booking.html'; }

  document.getElementById('dateStr').textContent = MACHUA.fmt(bDate);
  document.getElementById('timeStr').textContent = bTime;

  let selCourse  = null;
  let selOptions = new Set();
  let savedBooking = null;

  /* ── Render courses ──────────────────────────────────── */
  function renderCourses(){
    const cs=MACHUA.courses.get();
    const cl=document.getElementById('courseList');
    cl.innerHTML='';
    cs.forEach(c=>{
      const mins=c.minutes, h=~~(mins/60), m=mins%60;
      const tStr=h?`${h}時間${m?m+'分':''}`:`${m}分`;
      const div=document.createElement('div');
      div.className='course-item'+(selCourse===c.id?' selected':'');
      div.innerHTML=`
        <input type="radio" name="course" value="${c.id}" ${selCourse===c.id?'checked':''}>
        <span class="course-name">${c.name}</span>
        <span class="course-meta"><span class="course-price">¥${c.price.toLocaleString()}</span><span class="course-time">${tStr}</span></span>`;
      div.onclick=()=>{ selCourse=c.id; selOptions.clear(); renderCourses(); renderOptions(); updateTotal(); };
      cl.appendChild(div);
    });
  }

  /* ── Render options ──────────────────────────────────── */
  function renderOptions(){
    const ol=document.getElementById('optList');
    if(!selCourse){ ol.innerHTML=`<div id="optEmpty">コースを選択するとオプションが表示されます</div>`; return; }
    const c=MACHUA.courses.find(selCourse);
    if(!c||c.options.length===0){ ol.innerHTML=`<div id="optEmpty">このコースにオプションはありません</div>`; return; }
    ol.innerHTML='';
    const wrap=document.createElement('div'); wrap.className='opt-list';
    c.options.forEach(o=>{
      const mins=o.minutes, h=~~(mins/60), m=mins%60;
      const tStr=h?`${h}時間${m?m+'分':''}`:`${m}分`;
      const div=document.createElement('div');
      div.className='opt-item'+(selOptions.has(o.id)?' selected':'');
      div.innerHTML=`
        <input type="checkbox" value="${o.id}" ${selOptions.has(o.id)?'checked':''}>
        <span class="opt-name">${o.name}</span>
        <span class="opt-meta">+¥${o.price.toLocaleString()}<span class="opt-t">${tStr}</span></span>`;
      div.onclick=e=>{
        if(e.target.tagName==='INPUT') return;
        selOptions.has(o.id)?selOptions.delete(o.id):selOptions.add(o.id);
        renderOptions(); updateTotal();
      };
      div.querySelector('input').onchange=e=>{
        e.target.checked?selOptions.add(o.id):selOptions.delete(o.id);
        div.classList.toggle('selected',e.target.checked); updateTotal();
      };
      wrap.appendChild(div);
    });
    ol.appendChild(wrap);
  }

  /* ── Update totals ───────────────────────────────────── */
  function updateTotal(){
    if(!selCourse){ document.getElementById('totalPrice').textContent='¥0'; document.getElementById('totalTime').textContent='— 分'; checkSubmit(); return; }
    const c=MACHUA.courses.find(selCourse);
    let price=c.price, mins=c.minutes;
    selOptions.forEach(id=>{ const o=c.options.find(o=>o.id===id); if(o){price+=o.price;mins+=o.minutes;} });
    document.getElementById('totalPrice').textContent=`¥${price.toLocaleString()}`;
    const h=~~(mins/60),m=mins%60;
    document.getElementById('totalTime').textContent=h?`${h}時間${m?m+'分':''}`:`${m}分`;
    checkSubmit();
  }

  /* ── Form validation ─────────────────────────────────── */
  function checkSubmit(){
    const ok=selCourse&&document.getElementById('fName').value.trim()&&document.getElementById('fPhone').value.trim()&&document.getElementById('fEmail').value.trim();
    document.getElementById('submitBtn').disabled=!ok;
  }
  ['fName','fPhone','fEmail'].forEach(id=>document.getElementById(id).addEventListener('input',checkSubmit));

  /* ── Submit ──────────────────────────────────────────── */
  document.getElementById('submitBtn').onclick=()=>{
    const name=document.getElementById('fName').value.trim();
    const phone=document.getElementById('fPhone').value.trim();
    const email=document.getElementById('fEmail').value.trim();
    if(!name||!phone||!email||!selCourse){ alert('必須項目を入力してください'); return; }

    const c=MACHUA.courses.find(selCourse);
    let price=c.price,mins=c.minutes;
    selOptions.forEach(id=>{ const o=c.options.find(o=>o.id===id); if(o){price+=o.price;mins+=o.minutes;} });

    const bk=MACHUA.bookings.add({
      date:bDate,startTime:bTime,
      courseId:selCourse,optionIds:[...selOptions],
      totalPrice:price,totalMinutes:mins,
      name,phone,email,
    });
    savedBooking=bk;

    // Show modal
    const c2=MACHUA.courses.find(bk.courseId);
    const optNames=(bk.optionIds||[]).map(id=>{ const o=c2.options.find(o=>o.id===id); return o?o.name:id; }).join('、')||'なし';
    const h=~~(mins/60),m=mins%60;
    const tStr=h?`${h}時間${m?m+'分':''}`:`${m}分`;
    document.getElementById('modalDetails').innerHTML=`
      <dt>予約日時</dt><dd>${MACHUA.fmt(bDate)} ${bTime}</dd>
      <dt>コース</dt><dd>${c2.name}</dd>
      <dt>オプション</dt><dd>${optNames}</dd>
      <dt>合計料金</dt><dd>¥${price.toLocaleString()}</dd>
      <dt>所要時間</dt><dd>${tStr}</dd>
      <dt>お名前</dt><dd>${name}</dd>
      <dt>電話番号</dt><dd>${phone}</dd>
    `;
    document.getElementById('modal').classList.remove('hidden');

    // Send emails
    setTimeout(()=>{ MACHUA.mailCustomer(bk); MACHUA.mailAdmin(bk); },600);
  };

  document.getElementById('retryMail').onclick=()=>{ if(savedBooking){ MACHUA.mailCustomer(savedBooking); MACHUA.mailAdmin(savedBooking); } };

  /* ── Init ────────────────────────────────────────────── */
  renderCourses();
  renderOptions();
  updateTotal();
</script>
</body>
</html>
